<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061127"/>
      <stop offset="0.56" stop-color="#0a1c39"/>
      <stop offset="1" stop-color="#123d54"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#061127" stop-opacity="0.98"/>
      <stop offset="0.55" stop-color="#061127" stop-opacity="0.83"/>
      <stop offset="1" stop-color="#061127" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5d686" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#f5d686"/>
      <stop offset="1" stop-color="#fff9ec"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="42%" r="48%">
