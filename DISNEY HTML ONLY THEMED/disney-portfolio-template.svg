    <line x1="1246" y1="582" x2="1270" y2="582" stroke="#ff5d62" stroke-width="4"/><text x="1246" y="616">03  CITY</text>
    <line x1="834" y1="664" x2="858" y2="664" stroke="#ffd28a" stroke-width="4"/><text x="834" y="698">04  SANDS</text>
    <line x1="1040" y1="664" x2="1064" y2="664" stroke="#dff9ff" stroke-width="4"/><text x="1040" y="698">05  FROST</text>
    <line x1="1246" y1="664" x2="1270" y2="664" stroke="#d3baff" stroke-width="4"/><text x="1246" y="698">06  COSMIC</text>
