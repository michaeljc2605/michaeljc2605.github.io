  <text x="834" y="414" fill="#f5d686" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="3">TOOLS</text>
  <text x="834" y="450" fill="#fff9ec" font-family="Arial, Helvetica, sans-serif" font-size="17">React  ·  TypeScript  ·  Motion  ·  Prototyping</text>

