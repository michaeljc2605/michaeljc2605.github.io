  <text x="834" y="116" fill="#f5d686" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="3">OVERVIEW</text>
  <text x="834" y="202" fill="#fff9ec" font-family="Georgia, Times New Roman, serif" font-size="30">A homepage concept built as one</text>
