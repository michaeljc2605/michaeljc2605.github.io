  <text x="104" y="128" fill="#f5d686" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="4">PORTFOLIO  /  CASE STUDY</text>
  <text x="104" y="306" fill="#fff9ec" font-family="Georgia, Times New Roman, serif" font-size="98" font-weight="700">ONE CASTLE.</text>
  <text x="104" y="405" fill="#fff9ec" font-family="Georgia, Times New Roman, serif" font-size="98" font-weight="700">MANY REALMS.</text>
  <text x="108" y="482" fill="#d9ef9d" font-family="Georgia, Times New Roman, serif" font-size="29" font-style="italic">A cinematic digital experience</text>
  <text x="108" y="522" fill="#d9ef9d" font-family="Georgia, Times New Roman, serif" font-size="29" font-style="italic">for stories that feel limitless.</text>

  <text x="108" y="624" fill="#f5d686" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3">ROLE</text>
