  <text x="108" y="707" fill="#f5d686" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3">YEAR</text>
  <text x="108" y="736" fill="#fff9ec" font-family="Arial, Helvetica, sans-serif" font-size="19">2026</text>

