  <text x="104" y="938" fill="#fff9ec" fill-opacity="0.64" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3">REPLACE TEXT + ARTWORK  /  KEEP THE SYSTEM</text>
  <text x="1400" y="938" fill="#f5d686" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2">01 — 06</text>
